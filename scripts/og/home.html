<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="base.css">
  <style>
    h1 { font-size: 78px; margin-top: auto; }
    .sub { margin: 22px 0 30px; color: var(--text-soft); font-size: 24px; line-height: 1.4; max-width: 400px; }

    .form {
      display: grid;
      gap: 16px;
      width: 400px;
      padding: 24px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .form-title { font-weight: 600; font-size: 20px; letter-spacing: -0.02em; }
    .field span { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 500; }
    .field b {
      display: block;
      padding: 10px 12px;
      border: 1px solid var(--accent);
      border-radius: 9px;
      box-shadow: 0 0 0 4px var(--accent-soft);
      font-weight: 400;
      font-size: 16px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body class="rails">
  <div class="layout">
    <div class="copy">
      <div class="wordmark">
        <span class="mark"><svg width="18" height="18" viewBox="0 0 14 14"><path d="M2 9.5h6.5M11 3.5v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        auto-form-filler
      </div>
      <h1>Fill any form from its link.</h1>
      <p class="sub">Put values in a URL. The matching fields fill in when the page opens.</p>
      <div class="install"><b>npm i</b>&nbsp;@cnaallotey/auto-form-filler</div>
    </div>

    <div class="panel">
      <div class="window">
        <div class="bar">
          <span class="dots"><i></i><i></i><i></i></span>
          <div class="address"><span class="dim">example.com/signup?</span>email=<mark>ada%40example.com</mark>&amp;firstname=<mark>Ada</mark>&amp;plan=<mark>team</mark></div>
        </div>
        <div class="body">
          <div class="form">
            <div class="form-title">Create your account</div>
            <div class="field"><span>Work email</span><b>ada@example.com</b></div>
            <div class="row">
              <div class="field"><span>First name</span><b>Ada</b></div>
              <div class="field"><span>Plan</span><b>Team</b></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
